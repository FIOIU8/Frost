name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build + spotless (JDK 21)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      - name: 确保 gradlew 可执行
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew build --stacktrace

      - name: Spotless check
        run: ./gradlew spotlessCheck --stacktrace

      - name: 依赖许可证审计（禁止 GPL/AGPL/SSPL，未知即失败）
        run: |
          ./gradlew :catalog:dependencies --configuration desktopRuntimeClasspath -q > "$RUNNER_TEMP/deps-desktop.txt"
          ./gradlew :catalog-android:dependencies --configuration debugRuntimeClasspath -q > "$RUNNER_TEMP/deps-android.txt"
          python3 tools/license_audit.py "$RUNNER_TEMP/deps-desktop.txt" "$RUNNER_TEMP/deps-android.txt" > "$RUNNER_TEMP/license-report.md"
          echo "许可证审计通过：无禁止类、无未知"

      - name: 上传许可证报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: license-report
          path: ${{ runner.temp }}/license-report.md
          if-no-files-found: warn

      - name: 离屏渲染（无 GUI，验证 Compose + Skiko 渲染管线）
        # xvfb 兜底：Linux runner 上没有显示服务器，Skiko 需要它才能建 surface
        run: xvfb-run --auto-servernum ./gradlew :catalog:renderBaseline --stacktrace

      - name: 上传渲染基线
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalog-baseline
          path: "docs/baseline/p1/*.png"
          if-no-files-found: warn

      - name: 上传测试报告（失败也传）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: "**/build/reports/tests/**"
          if-no-files-found: ignore

  # 后续 Job（P1/P6 起启用，见 docs/PLAN.md §11）：
  #   api-check  → ./gradlew apiCheck
  #   license    → 依赖许可证报告 + THIRD_PARTY_NOTICES.md 一致性
  #   screenshot → Roborazzi/Paparazzi 截图 diff
  # 现在不建空 Job：CI 里挂着永远 skipped 的 Job 会误导人。
