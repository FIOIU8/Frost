# ============================================================
# Frost — 工程属性
# ============================================================

# ---- 发布坐标：迁移到组织账号时只需改这一段（决策 D5 + 迁移策略）----
# 当前：GitHub 个人账号 FIOIU8
# 迁移到组织后：把 frostOwner / frostRepoUrl / frostScmConnection 改成组织值，
#              frostGroup 随之改为 io.github.<org>.frost，代码零改动。
frostOwner=io.github.fioiu8
frostGroup=io.github.fioiu8.frost
frostRepoUrl=https://github.com/FIOIU8/frost
frostScmConnection=scm:git:https://github.com/FIOIU8/frost.git

# ---- 工具链 ----
frost.jvmToolchain=21

# ---- Gradle ----
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
# 配置缓存：等首次 ./gradlew build 绿了再打开，避免 P0 阶段排查噪音叠加
# org.gradle.configuration-cache=true

# ---- Kotlin ----
kotlin.code.style=official

# ---- Android ----
android.useAndroidX=true
android.nonTransitiveRClass=true
